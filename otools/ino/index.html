<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ino</title>
<style>
  :root {
    --bg: #0a1128;
    --sky: #7dd3fc;
    --sky2: #4fb3e8;
    --muted: #a9dffb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--sky);
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  h1 {
    font-size: 2.8rem;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .sub {
    font-size: 0.9rem;
    color: var(--muted);
    opacity: 0.7;
  }
  .status {
    margin-top: 18px;
    font-size: 0.8rem;
    color: var(--sky2);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <h1 id="time">--:--:--</h1>
  <div class="sub">local time</div>
  <div class="status" id="status">broadcasting…</div>

<script>
(function () {
  const channel = new BroadcastChannel('aplite-ino');
  const timeEl = document.getElementById('time');
  const statusEl = document.getElementById('status');

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const str = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    timeEl.textContent = str;

    channel.postMessage({
      type: 'ino-tick',
      time: str,
      iso: now.toISOString(),
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      ts: Date.now()
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      channel.postMessage({ type: 'ino-hello', ts: Date.now() });
    }
  });

  channel.postMessage({ type: 'ino-hello', ts: Date.now() });

  channel.onmessage = (ev) => {
    if (ev.data && ev.data.type === 'adino-ping') {
      channel.postMessage({ type: 'ino-hello', ts: Date.now() });
      statusEl.textContent = 'adino is listening';
    }
  };

  setInterval(tick, 250);
  tick();
})();
</script>
</body>
</html>
