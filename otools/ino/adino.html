<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>adino</title>
<style>
  :root {
    --bg: #0a1128;
    --panel: #0f1c33;
    --border: #1c3a5e;
    --sky: #7dd3fc;
    --sky2: #4fb3e8;
    --muted: #a9dffb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--sky);
    font-family: system-ui, sans-serif;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  header span {
    font-weight: 400;
    font-size: 0.8rem;
    color: var(--sky2);
    opacity: 0.8;
    margin-left: 8px;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 28px 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .label {
    font-size: 0.72rem;
    color: var(--sky2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .value {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--sky);
  }
  .meta {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.75;
  }
  .waiting {
    color: var(--sky2);
    opacity: 0.6;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <header>
    adino
    <span>listening for ino</span>
  </header>

  <main>
    <div class="card">
      <div class="label">Status</div>
      <div class="value" id="status">waiting for index.html…</div>
      <div class="meta" id="lastSeen">open index.html in another tab</div>
    </div>

    <div class="card">
      <div class="label">Time reported by index.html</div>
      <div class="value" id="time">—</div>
      <div class="meta" id="tz"></div>
    </div>
  </main>

<script>
(function () {
  const channel = new BroadcastChannel('aplite-ino');
  const statusEl = document.getElementById('status');
  const lastSeenEl = document.getElementById('lastSeen');
  const timeEl = document.getElementById('time');
  const tzEl = document.getElementById('tz');

  let lastTs = 0;

  function ago(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 2) return 'just now';
    if (s < 60) return s + 's ago';
    return Math.floor(s / 60) + 'm ago';
  }

  channel.postMessage({ type: 'adino-ping', ts: Date.now() });

  channel.onmessage = (ev) => {
    const msg = ev.data;
    if (!msg || !msg.type) return;

    if (msg.type === 'ino-hello' || msg.type === 'ino-tick') {
      lastTs = msg.ts || Date.now();
      statusEl.textContent = 'connected';
      lastSeenEl.textContent = 'last seen ' + ago(lastTs);

      if (msg.time) {
        timeEl.textContent = msg.time;
      }
      if (msg.tz) {
        tzEl.textContent = msg.tz + (msg.iso ? ' · ' + msg.iso : '');
      }
    }
  };

  setInterval(() => {
    if (lastTs) {
      lastSeenEl.textContent = 'last seen ' + ago(lastTs);
      if (Date.now() - lastTs > 4000) {
        statusEl.textContent = 'quiet (index may be closed)';
      }
    }
  }, 1000);
})();
</script>
</body>
</html>
